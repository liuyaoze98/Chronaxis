# 合成教学配置；请连同配套输入使用，数值仅用于复现本例。
config_version: 4                                   # 声明分析文件采用的字段结构版本；当前填写整数4
dataset:                                            # 设置本次分析名称及可选的对象、会话和时间范围
  name: rule_example                                # 命名本次分析数据集；名称写入结果身份字段
sources:                                            # 列出输入来源；每项规定数据位置、格式和时间解释方式
  - paths: data/can/rule-hysteresis-extended.asc    # 选择输入文件、连续分卷列表或目录；相对路径基于本配置，目录按自然序读取
    dbc_by_channel:                                 # 为每个CAN通道指定解码用DBC文件；键是通道编号的字符串
      '1': data/can/teaching.dbc                    # 为这个通道指定DBC文件；路径相对当前配置文件，通道键须为字符串
signals:                                            # 把输入字段定义为有名称、类型、单位和有效期的分析信号
  - field:                                          # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x11d'                             # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Temperature                           # 填写DBC中的信号名称，大小写须一致
    name: temperature                               # 给分析信号取名称；后续表达式和计算通过此名称引用它
    valid_for: 20s                                  # 设置一次有效更新最多沿用多久；依据采样周期和允许数据陈旧程度填写
rules:                                              # 列出识别活动或瞬间变化的规则；每项产生有独立ID的事件
  - enter_condition: temperature >= 80              # 设置进入活动的条件；与退出条件分别判断
    enter_delay: 1s                                 # 设置进入条件需连续成立的等待时间；0s表示不额外等待
    exit_condition: temperature <= 75               # 设置退出活动的条件；按恢复要求填写
    exit_delay: 1s                                  # 设置退出条件需连续成立的等待时间；0s表示不额外等待
    name: detected                                  # 为规则取唯一名称；窗口rule和计算scope通过此名选择它的事件
    rule_type: hysteresis                           # 选择活动或变化识别算法；本例分别用进入和退出条件判断活动，避免一个阈值附近反复切换

# 合成教学配置；请连同配套输入使用，数值仅用于复现本例。
config_version: 4                              # 声明分析文件采用的字段结构版本；当前填写整数4
dataset:                                       # 设置本次分析名称及可选的对象、会话和时间范围
  name: preset_example                         # 命名本次分析数据集；名称写入结果身份字段
sources:                                       # 列出输入来源；每项规定数据位置、格式和时间解释方式
  - paths: data/can/expression-extended.asc    # 选择输入文件、连续分卷列表或目录；相对路径基于本配置，目录按自然序读取
    dbc_by_channel:                            # 为每个CAN通道指定解码用DBC文件；键是通道编号的字符串
      '1': data/can/teaching.dbc               # 为这个通道指定DBC文件；路径相对当前配置文件，通道键须为字符串
signals:                                       # 把输入字段定义为有名称、类型、单位和有效期的分析信号
  - field:                                     # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x114'                        # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Current                          # 填写DBC中的信号名称，大小写须一致
    measurement_location: pack_terminal        # 声明实际测点；pack_terminal表示电池包端，须依据接线和设备定义
    name: current                              # 给分析信号取名称；后续表达式和计算通过此名称引用它
    sign_convention: positive_is_charge        # 声明正负值的业务含义；positive_is_charge表示正电流为充电，不执行取反
    valid_for: 20s                             # 设置一次有效更新最多沿用多久；依据采样周期和允许数据陈旧程度填写
  - field:                                     # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x11f'                        # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Voltage                          # 填写DBC中的信号名称，大小写须一致
    measurement_location: pack_terminal        # 声明实际测点；pack_terminal表示电池包端，须依据接线和设备定义
    name: voltage                              # 给分析信号取名称；后续表达式和计算通过此名称引用它
    valid_for: 20s                             # 设置一次有效更新最多沿用多久；依据采样周期和允许数据陈旧程度填写
derived:                                       # 用已定义信号的表达式生成新信号；先定义再在后续功能中引用
  power:                                       # 定义名为power的派生信号，后面的计算通过此名称引用
    expr: voltage * current                    # 规定派生值如何由已有信号计算；名称必须先在signals或前面的derived中定义
    unit: W                                    # 声明表达式计算结果的单位；依据公式与输入单位取得
calculations:                                  # 列出希望获得的统计或积分结果，每项独立选择范围和算法
  - name: maximum_power                        # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: sample_maximum                  # 选择计算方法；本例取范围内有效真实样本的最大值
    expr: power                                # 指定参与计算的数值或信号表达式；引用前面已定义的信号

# 合成教学配置；请连同配套输入使用，数值仅用于复现本例。
mapping_version: 1                        # 声明INI映射文件结构版本；当前填写整数1
path_base: mapping_directory              # 选择映射内相对路径基准；mapping_directory表示本映射文件所在目录
io_policy: explicit_mapping               # 选择输入输出来源；explicit_mapping使用analysis中明确声明的设置
analysis:                                 # 提供转换后的分析基础配置；来源和信号在此定义，事件等节点由INI生成
  config_version: 3                       # 声明分析文件采用的字段结构版本；当前填写整数3
  dataset:                                # 设置本次分析名称及可选的对象、会话和时间范围
    name: imported_energy                 # 命名本次分析数据集；名称写入结果身份字段
  sources:                                # 列出输入来源；每项规定数据位置、格式和时间解释方式
    - name: bus                           # 给本来源取计划内唯一名称；下方signals.source引用这个名称
      paths: ../data/message-clean.asc    # 选择输入文件、连续分卷列表或目录；相对路径基于本配置，目录按自然序读取
      dbc_by_channel:                     # 为每个CAN通道指定解码用DBC文件；键是通道编号的字符串
        '1': ../data/power.dbc            # 为这个通道指定DBC文件；路径相对当前配置文件，通道键须为字符串
  signals:                                # 把输入字段定义为有名称、类型、单位和有效期的分析信号
    - name: power                         # 给分析信号取名称；后续表达式和计算通过此名称引用它
      field:                              # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
        frame_id: 256                     # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
        signal: Power                     # 填写DBC中的信号名称，大小写须一致
      period: 100ms                       # 声明本信号正常更新周期；从设备/采集规范取得，省略valid_for时按其3倍确定有效期
aliases:                                  # 把旧INI变量名对应到analysis.signals中已定义的分析名称
  signal_P: power                         # 把INI变量signal_P绑定到右侧已定义的分析信号名
sections:                                 # 逐个列出旧INI分析段的转换设置；段名必须与INI一致
  integral_energy:                        # 提供INI中integral_energy分析段的转换设置
    name: energy                          # 命名该段生成的计算，供结果表识别
    source: bus                           # 选择analysis.sources中定义的原始CAN来源名称
    unit: J                               # 声明转换后累计结果单位；必须与旧公式和参数单位一致
    message_policy: current_message-v1    # 选择逐条消息求值方式；current_message-v1只使用当前目标报文的值
    update_message:                       # 指定触发一次求值的目标报文；通道和ID从日志/DBC取得
      frame_id: 256                       # 指定每到一条便求值的报文ID；从DBC取得
    parameter_units:                      # 声明每个旧INI参数的单位，键须与INI参数完全对应
      period: s                           # 给旧INI参数period声明实际业务单位；不自动改变原数值

# 合成教学配置；请连同配套输入使用，数值仅用于复现本例。
config_version: 3                                   # 声明分析文件采用的字段结构版本；当前填写整数3
dataset:                                            # 设置本次分析名称及可选的对象、会话和时间范围
  name: preset_example                              # 命名本次分析数据集；名称写入结果身份字段
sources:                                            # 列出输入来源；每项规定数据位置、格式和时间解释方式
  - paths: data/can/preset-command-automatic.asc    # 选择输入文件、连续分卷列表或目录；相对路径基于本配置，目录按自然序读取
    dbc_by_channel:                                 # 为每个CAN通道指定解码用DBC文件；键是通道编号的字符串
      '1': data/can/teaching.dbc                    # 为这个通道指定DBC文件；路径相对当前配置文件，通道键须为字符串
signals:                                            # 把输入字段定义为有名称、类型、单位和有效期的分析信号
  - field:                                          # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x11a'                             # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Request                               # 填写DBC中的信号名称，大小写须一致
    name: request                                   # 给分析信号取名称；后续表达式和计算通过此名称引用它
    semantic_contract_version: '1'                  # 声明业务用途采用的约定版本；预设自动查找填字符串"1"并同时提供semantic_id
    semantic_id: command.request                    # 声明信号的业务用途；自动选预设角色时按角色表填写，普通计算可省略
    valid_for: 20s                                  # 设置一次有效更新最多沿用多久；依据采样周期和允许数据陈旧程度填写
    choices:                                        # 把输入状态代码转成分析值；每项是[输入代码,结果值]，代码查设备规范
      - [0, false]
      - [1, true]
  - field:                                          # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x11b'                             # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Response                              # 填写DBC中的信号名称，大小写须一致
    name: response                                  # 给分析信号取名称；后续表达式和计算通过此名称引用它
    semantic_contract_version: '1'                  # 声明业务用途采用的约定版本；预设自动查找填字符串"1"并同时提供semantic_id
    semantic_id: command.response                   # 声明信号的业务用途；自动选预设角色时按角色表填写，普通计算可省略
    valid_for: 20s                                  # 设置一次有效更新最多沿用多久；依据采样周期和允许数据陈旧程度填写
    choices:                                        # 把输入状态代码转成分析值；每项是[输入代码,结果值]，代码查设备规范
      - [0, false]
      - [1, true]
presets:                                            # 选择预先组合好的规则与计算，并提供角色信号和业务参数
  - name: demo_preset                               # 给本次预设实例取唯一名称；展开的规则/计算名称使用此前缀
    parameters:                                     # 提供本预设的业务参数；各预设支持的字段不同，不能互相套用
      max_delay: 2s                                 # 设置请求到响应的最大允许延迟；必须不小于最小延迟
      min_delay: 0s                                 # 设置请求到响应的最小允许延迟；按协议要求填写
    preset_type: command_response                   # 选择业务任务；charge_session充电、fault_context报警上下文、command_response配对、threshold_excursion阈值
    version: '1'                                    # 选择预设定义版本；当前填写字符串"1"，与config_version的整数3分别使用

# 合成教学配置；请连同配套输入使用，数值仅用于复现本例。
config_version: 4                       # 声明分析文件采用的字段结构版本；当前填写整数4
imports: [shared/definitions.yaml]      # 先加载公共定义文件；列表项为相对当前配置文件的路径
dataset:                                # 设置本次分析名称及可选的对象、会话和时间范围
  name: imported_energy                 # 命名本次分析数据集；名称写入结果身份字段
calculations:                           # 列出希望获得的统计或积分结果，每项独立选择范围和算法
  - name: energy                        # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: integral                 # 选择计算方法；本例将有效数值乘持续时间后累计，例如功率乘秒得到能量
    expr: power                         # 指定参与计算的数值或信号表达式；引用前面已定义的信号
  - name: sample_average                # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: sample_mean              # 选择计算方法；本例对范围内有效真实样本等权求平均，每个样本计一次
    expr: power                         # 指定参与计算的数值或信号表达式；引用前面已定义的信号
  - name: time_average                  # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: time_weighted_mean       # 选择计算方法；本例按有效值持续时长加权求平均
    expr: power                         # 指定参与计算的数值或信号表达式；引用前面已定义的信号
  - name: double_energy                 # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: integral                 # 选择计算方法；本例将有效数值乘持续时间后累计，例如功率乘秒得到能量
    expr: double_power                  # 指定参与计算的数值或信号表达式；引用前面已定义的信号
metadata:                               # 保存说明性信息；字段不会自动校准数据或更改计算公式
  device_label: home                    # 记录产出设备标签；当前独立导出仅接受home/work，普通分析与批量报告规则见对应说明
  data_kind: synthetic                  # 记录数据来源性质；synthetic表示人工构造的测试输入
  purpose: 演示导入公共来源、信号及派生功率，并计算能量和均值    # 记录这份配置的用途；不参与条件判断或数值计算

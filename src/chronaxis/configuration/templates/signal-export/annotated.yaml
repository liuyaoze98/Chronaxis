%YAML 1.2
---
config_version: 4                # 声明分析文件采用的字段结构版本；新分析填写整数4
dataset:                         # 设置本次分析名称及可选的对象、会话和时间范围
  name: signal_export_example    # 命名本次分析数据集；名称写入结果身份字段
sources:                         # 列出输入来源；每项规定数据位置、格式和时间解释方式
  - path: data/power.asc         # 指定单个输入文件；相对路径从本配置文件所在目录计算
    dbc_by_channel:              # 为每个CAN通道指定解码用DBC文件；键是通道编号的字符串
      '1': data/teaching.dbc     # 为这个通道指定DBC文件；路径相对当前配置文件，通道键须为字符串
signals:                         # 把输入字段定义为有名称、类型、单位和有效期的分析信号
  - name: power                  # 给分析信号取名称；后续表达式和计算通过此名称引用它
    field:                       # 指定来源中的原始字段；CSV填表头，CAN填写通道/报文ID/DBC信号名
      frame_id: '0x200'          # 选择包含信号的报文ID；从对应DBC取得，可写整数或支持的进制文本
      signal: Power              # 填写DBC中的信号名称，大小写须一致
calculations:                    # 列出希望获得的统计或积分结果，每项独立选择范围和算法
  - name: energy                 # 为这项计算结果取唯一名称；结果表用它区分计算项
    operation: integral          # 选择计算方法；本例将有效数值乘持续时间后累计，例如功率乘秒得到能量
    expr: power                  # 指定参与计算的数值或信号表达式；引用前面已定义的信号
outputs:                         # 选择额外导出的数据及格式；默认结果表由运行入口提供
  signal_csv:                    # 配置额外的信号CSV导出；null表示不启用这项额外输出
    signals: [power]             # 选择要导出的分析信号名；来自前面的信号定义
    resampling:                  # 设置独立信号输出网格；不修改分析时的信号历史和积分
      continuous: [power]        # 列出可线性插值的分析信号名；仅选择物理上允许中间值的连续量
      period: 500ms              # 指定信号导出网格间隔；依据输出采样需求填写
      max_gap: 3s                # 限制用于插值的相邻记录间隔；按允许缺测程度选择
metadata:                        # 保存说明性信息；字段不会自动校准数据或更改计算公式
  device_label: home             # 示例制作于home；实际使用改为本次设备标签（home/work），不会自动识别

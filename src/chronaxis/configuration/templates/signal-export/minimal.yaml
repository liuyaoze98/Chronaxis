%YAML 1.2
---
config_version: 4
dataset:
  name: signal_export_example
sources:
  - path: data/power.asc
    dbc_by_channel:
      '1': data/teaching.dbc
signals:
  - name: power
    field:
      frame_id: '0x200'
      signal: Power
calculations:
  - name: energy
    operation: integral
    expr: power
outputs:
  signal_csv:
    signals:
      - power
    resampling:
      continuous:
        - power
      period: 500ms
      max_gap: 3s
execution:              # 设置本次分析的并行处理方式
  process_count: 4      # 最多4个文件工作进程；实际并行数不超过输入文件数

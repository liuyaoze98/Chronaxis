%YAML 1.2
---
config_version: 4
dataset:
  name: signal_export_example
sources:
  - path: data/power.asc
    dbc_by_channel:
      '1': data/teaching.dbc
signals:
  - name: power
    field:
      frame_id: '0x200'
      signal: Power
calculations:
  - name: energy
    operation: integral
    expr: power
outputs:
  signal_csv:
    signals:
      - power
    resampling:
      continuous:
        - power
      period: 500ms
      max_gap: 3s
metadata:                       # 当前导出API要求来源标签；普通分析不需要此字段
  device_label: home            # 示例制作于home；实际使用改为本次设备标签（home/work），不会自动识别

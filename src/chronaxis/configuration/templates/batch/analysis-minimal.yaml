%YAML 1.2
---
config_version: 4
dataset:
  name: batch_energy_example
sources:
  - path: data/power.asc
    dbc_by_channel:
      '1': data/teaching.dbc
signals:
  - name: power
    field:
      frame_id: '0x200'
      signal: Power
calculations:
  - name: energy
    operation: integral
    expr: power

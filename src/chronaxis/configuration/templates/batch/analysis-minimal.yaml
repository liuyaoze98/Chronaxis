%YAML 1.2
---
config_version: 4
dataset:
  name: batch_energy_example
sources:
  - path: data/power.asc
    dbc_by_channel:
      '1': data/teaching.dbc
signals:
  - name: power
    field:
      frame_id: '0x200'
      signal: Power
calculations:
  - name: energy
    operation: integral
    expr: power
execution:            # 设置本次分析的并行处理方式
  process_count: 1    # 批量外层负责并行；子任务保持1，避免嵌套进程池

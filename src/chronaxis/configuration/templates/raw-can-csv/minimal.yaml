%YAML 1.2
---
config_version: 3
dataset:
  name: raw_can_csv_example
sources:
  - path: data/sample.csv
    dbc_by_channel:
      '1': data/sample.dbc
    time:
      unit: s
    source_type: raw_can_csv
    reader:
      time_format: numeric
      layout:
        fields:
          timestamp: time
          frame_id: id
          data: data
          payload_length: length
        # 输入含DBC未定义ID且没有帧型列，需明确本文件均为标准ID、经典CAN。
          is_extended:
            fixed: false
          is_fd:
            fixed: false
      id_base: 16
signals:
  - name: voltage
    field:
      signal: Voltage
      frame_id: '0x100'
calculations:
  - name: voltage_area
    expr: voltage
    operation: integral

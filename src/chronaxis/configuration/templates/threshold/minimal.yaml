%YAML 1.2
---
config_version: 4
dataset:
  name: threshold_example
sources:
  - path: data/threshold.asc
    dbc_by_channel:
      '1': data/teaching.dbc
signals:
  - name: temperature
    field:
      frame_id: '0x204'
      signal: Temperature
presets:
  - name: hot
    role_bindings:
      signal: temperature
    parameters:
      enter_threshold: 80
      exit_threshold: 75
    preset_type: threshold_excursion
execution:            # 设置本次分析的并行处理方式
  process_count: 4    # 最多4个文件工作进程；实际并行数不超过输入文件数

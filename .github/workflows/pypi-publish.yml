name: Publish Chronaxis to PyPI

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the verified 0.1.0.dev6 files to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: chronaxis-pypi-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'liuyaoze98/Chronaxis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/chronaxis/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0.dev6" --jq '.object.sha')
          source_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          test "$source_commit" = '2f964c8e96cd291ae091b1cb2d83e00d9ac73fc2'
          gh release download v0.1.0.dev6 --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern chronaxis-0.1.0.dev6-py3-none-any.whl \
            --pattern chronaxis-0.1.0.dev6.tar.gz
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          cd dist
          sha256sum --strict --check - <<'SHA256'
          4d797badaa631e7d5804b14d3be3498617060a31ef3e1ad568379ad3810f182f  chronaxis-0.1.0.dev6-py3-none-any.whl
          9a5483ebff50b4ef1c1a5b066c30be3ff2b3874bfc1b8be0aac4e458202f2def  chronaxis-0.1.0.dev6.tar.gz
          SHA256

      - name: Publish verified packages using PyPI Trusted Publishing
        if: inputs.upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: false

      - name: Record verification-only result
        if: ${{ !inputs.upload }}
        shell: bash
        run: |
          echo 'Both release files match the reviewed SHA256 values. Nothing was uploaded to PyPI.' >> "$GITHUB_STEP_SUMMARY"

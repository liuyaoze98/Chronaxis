# 使用src布局；实际支持平台在README中说明。
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronaxis"
version = "0.1.0.dev4"
description = "Declarative analysis of multi-source time series"
dynamic = ["readme"]
authors = [{name = "liuyaoze", email = "work@liuyaoze.com"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12,<3.14"
# 运行依赖允许范围与复现约束分开；平台能力要求见安装说明。
dependencies = [
    "numpy>=1.26.3,<2.6; python_version < '3.13'",
    "numpy>=2.1,<2.6; python_version >= '3.13'",
    "ruamel.yaml==0.19.1",
    "python-can==4.6.1",
    "cantools>=39.4.3,<46",
    "natsort==8.4.0",
    "jsonschema>=4.25.1,<4.27",
]

[project.urls]
Repository = "https://github.com/liuyaoze98/Chronaxis"
Documentation = "https://liuyaoze98.github.io/Chronaxis/"
Issues = "https://github.com/liuyaoze98/Chronaxis/issues"
Changelog = "https://github.com/liuyaoze98/Chronaxis/releases"

# 命令行入口与Python API共享计划加载和执行逻辑。
[project.scripts]
chronaxis = "chronaxis.cli:main"

# schema验证器已是运行依赖；保留test安装入口，不另行缩紧运行版本。
[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["src"]

# 初始化与场景验收读取同一套小型合成资源；不携带真实日志或历史快照。
[tool.setuptools.package-data]
"chronaxis.configuration" = ["templates/catalog.json", "templates/*/*.yaml", "templates/shared/*"]
